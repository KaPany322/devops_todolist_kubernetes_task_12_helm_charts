common:
  namespace: mysql

secrets:
  MYSQL_ROOT_PASSWORD: "1234" # Base64 encoding for "1234"
  MYSQL_USER: "app_user" # Base64 encoding for "app_user"
  MYSQL_PASSWORD: "1234" # Base64 encoding for "1234"

image:
  name: mysql
  repository: mysql
  version: 8.0

spec:
  replicas: 2

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 750m
    memory: 2Gi

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: "app"
              operator: In
              values:
                - mysql
        topologyKey: "kubernetes.io/hostname"
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "app"
              operator: In
              values:
                - mysql
